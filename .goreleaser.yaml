# GoReleaser configuration for Gira-G (ADR 0010)
# Pure-Go build (CGO_ENABLED=0); the tree-sitter seam from ADR 0002 stays
# intact for future use.
version: 2

project_name: gira

release:
  github:
    owner: EduardoShibukawa
    name: gira-g
  draft: false
  prerelease: auto

before:
  hooks:
    - go run ./cmd/gira skills manifest --format json --output skills-manifest.json

builds:
  - id: gira
    main: ./cmd/gira
    binary: gira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - THIRD_PARTY_NOTICES.md
      - skills-manifest.json

sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksums
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
