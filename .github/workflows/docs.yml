name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Build documentation site
        run: mise run docs:build

      - name: Quarantine compliance check
        run: |
          if grep -rE "(graphify|understand-anything)" website/docs website/src website/docusaurus.config.ts website/sidebars.ts; then
            echo "Quarantined comparative module reference found in docs site" >&2
            exit 1
          fi

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: gira-docs
          path: website/build/
