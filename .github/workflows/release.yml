name: release

# Tag-triggered releases (protected by ADR 0011:30) plus unsigned snapshot
# dry-runs on manual dispatch. Never push tags from automation; publishing a
# live GitHub Release always needs a separate explicit owner command.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Least privilege by default; the release job escalates only contents and
# OIDC for publishing plus keyless cosign signing.
permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run G-Ingá standalone validator
        run: node tools/validate/validate.js

      - name: Run test suite with race detector
        run: go test -race ./...

  snapshot:
    name: snapshot dry-run
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Snapshot release (no publish, no sign)
        run: goreleaser release --snapshot --clean --skip=sign

      - name: Verify skills manifest artifact
        run: go run ./cmd/gira skills manifest --format json

  release:
    name: release
    runs-on: ubuntu-latest
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      # Keyless cosign signing via GitHub OIDC: cosign is pinned in mise.toml
      # and .goreleaser.yaml signs checksums.txt with cosign sign-blob.
      - name: Publish release with GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
