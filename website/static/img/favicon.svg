<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Gira Favicon">
  <!-- High-contrast dark rounded badge for 16x16 browser tab legibility -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Simplified 8-point Helio-Graph crown for crisp 16x16 pixel rendering -->
  <g fill="#f59e0b">
    <path d="M16 1.5 L18.6 6.2 L13.4 6.2 Z"/>
    <path d="M16 30.5 L18.6 25.8 L13.4 25.8 Z"/>
    <path d="M1.5 16 L6.2 18.6 L6.2 13.4 Z"/>
    <path d="M30.5 16 L25.8 18.6 L25.8 13.4 Z"/>
    <path d="M5.7 5.7 L10.2 7.4 L7.4 10.2 Z"/>
    <path d="M26.3 5.7 L21.8 7.4 L24.6 10.2 Z"/>
    <path d="M5.7 26.3 L10.2 24.6 L7.4 21.8 Z"/>
    <path d="M26.3 26.3 L21.8 24.6 L24.6 21.8 Z"/>
  </g>

  <!-- Inner core disc -->
  <circle cx="16" cy="16" r="10.5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Bold G-graph trajectory optimized for 16x16 -->
  <path d="M20.5 11.2 L15.5 9.2 L10.5 12 L10.5 19.5 L15.5 22.5 L21 19.5 L21 16 L16 16"
        stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key graph nodes -->
  <circle cx="20.5" cy="11.2" r="1.9" fill="#fef3c7"/>
  <circle cx="10.5" cy="12" r="1.8" fill="#fbbf24"/>
  <circle cx="10.5" cy="19.5" r="1.8" fill="#fbbf24"/>
  <circle cx="15.5" cy="22.5" r="1.8" fill="#f59e0b"/>
  <circle cx="21" cy="16" r="2.0" fill="#38bdf8"/>
  <circle cx="16" cy="16" r="2.2" fill="#38bdf8"/>
</svg>
