<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Gira Helio-Graph Logo">
  <defs>
    <linearGradient id="hg-petal-main" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="hg-petal-alt" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="hg-core" cx="32" cy="32" r="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Outer secondary sunflower rays (rotated 15 deg) -->
  <g fill="url(#hg-petal-alt)" opacity="0.88">
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(15 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(45 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(75 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(105 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(135 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(165 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(195 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(225 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(255 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(285 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(315 32 32)"/>
    <path d="M32 2 L35.5 11 L28.5 11 Z" transform="rotate(345 32 32)"/>
  </g>

  <!-- Primary geometric sunflower crown petals -->
  <g fill="url(#hg-petal-main)">
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(30 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(60 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(90 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(120 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(150 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(180 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(210 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(240 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(270 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(300 32 32)"/>
    <path d="M32 1 L36.5 11.5 L32 14 L27.5 11.5 Z" transform="rotate(330 32 32)"/>
  </g>

  <!-- Dark architectural core disc with golden rim -->
  <circle cx="32" cy="32" r="21.5" fill="url(#hg-core)" stroke="#f59e0b" stroke-width="1.75"/>
  <circle cx="32" cy="32" r="18.5" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 2"/>

  <!-- Subtle internal cross-edges representing call/import graph -->
  <g stroke="#38bdf8" stroke-width="1.1" opacity="0.45">
    <line x1="22" y1="21" x2="32" y2="33"/>
    <line x1="20" y1="32" x2="32" y2="33"/>
    <line x1="23" y1="42" x2="32" y2="33"/>
    <line x1="34" y1="45" x2="32" y2="33"/>
  </g>

  <!-- Primary G-graph path (forming letter G and musical Sol spiral) -->
  <path d="M41 22 L31 18 L22 21 L20 32 L23 42 L34 45 L43 39 L43 33 L32 33"
        stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Evidence highlight edge -->
  <line x1="43" y1="33" x2="32" y2="33" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Architectural graph nodes -->
  <circle cx="41" cy="22" r="2.6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="31" cy="18" r="2.4" fill="#fbbf24"/>
  <circle cx="22" cy="21" r="2.5" fill="#fbbf24"/>
  <circle cx="20" cy="32" r="2.5" fill="#f59e0b"/>
  <circle cx="23" cy="42" r="2.5" fill="#fbbf24"/>
  <circle cx="34" cy="45" r="2.5" fill="#f59e0b"/>
  <circle cx="43" cy="39" r="2.6" fill="#fbbf24"/>
  <circle cx="43" cy="33" r="2.8" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
  <circle cx="32" cy="33" r="3.2" fill="#38bdf8" stroke="#fef3c7" stroke-width="1.2"/>
</svg>
